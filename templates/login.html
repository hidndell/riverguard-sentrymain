<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | RiverGuard</title>
    <style>
        :root {
            --accent-blue: #3498db;
            --crit-color: #c0392b;
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --border-dark: #2c2c2c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            margin: 0;
            padding: 40px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-wrap {
            width: 100%;
            max-width: 420px;
        }

        .back-link {
            display: inline-block;
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .back-link:hover {
            color: #fff;
        }

        .card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
        }

        h1 {
            color: var(--accent-blue);
            font-size: 1.5rem;
            margin: 0 0 6px 0;
        }

        .subtitle {
            color: #999;
            font-size: 0.9rem;
            margin: 0 0 22px 0;
        }

        .error-box {
            background: rgba(192, 57, 43, 0.2);
            border: 1px solid var(--crit-color);
            color: #ff8a80;
            padding: 11px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #e0e0e0;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
            background-color: #141414;
            color: #ffffff;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-login:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="login-wrap">
        <a href="/" class="back-link">&larr; Back to Water Monitoring Dashboard</a>

        <div class="card">
            <h1>Administrator Log In</h1>
            <p class="subtitle">Sign in to view and manage registered SMS alert numbers.</p>

            {% if error %}
                <div class="error-box" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="identifier">Username or Email</label>
                    <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        placeholder="Enter admin username or email"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">Log In</button>
            </form>
        </div>
    </div>

</body>
</html>
