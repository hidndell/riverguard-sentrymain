services:
  - type: web
    name: riverguard-sentry
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: EMERGENCY_NUMBERS
        value: "+639123456789"
      - key: DATABASE_URL
        sync: false

